<nav class="site-nav">
  <a class="site-brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
  <ul>
    <li><a href="{{ '/' | relative_url }}"{% if nav_url == '/' or nav_url == '/index' %} class="active"{% endif %}>About</a></li>
    <li><a href="{{ '/cv.html' | relative_url }}"{% if nav_url == '/cv' %} class="active"{% endif %}>CV</a></li>
    <li><a href="{{ '/gallery.html' | relative_url }}"{% if nav_url == '/gallery' %} class="active"{% endif %}>Gallery</a></li>
  </ul>
</nav>
